<style>
        .glass-panel {
            background: rgba(46, 196, 224, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .floating-label-group {
            position: relative;
        }

        .floating-label-group input:focus ~ label,
        .floating-label-group input:not(:placeholder-shown) ~ label {
            transform: translateY(-24px) scale(0.85);
            color: #57e0fd;
            background: #161616;
            padding: 0 4px;
        }

        .floating-label-group label {
            position: absolute;
            top: 14px;
            left: 16px;
            pointer-events: none;
            transition: all 0.2s ease;
            color: #869397;
        }

        .industrial-bg {
            background-color: #0A0A0A;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(46, 196, 224, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(46, 196, 224, 0.03) 0%, transparent 40%);
            position: relative;
            overflow: hidden;
        }

        .industrial-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .cyan-glow {
            box-shadow: 0 0 15px rgba(46, 196, 224, 0.3);
        }

<body class="bg-background text-on-background font-body-md industrial-bg min-h-screen flex items-center justify-center p-margin-mobile">
<!-- Subtle atmospheric light streaks -->
<div class="absolute top-0 left-1/4 w-px h-full bg-gradient-to-b from-transparent via-primary/10 to-transparent opacity-50"></div>
<div class="absolute top-0 right-1/4 w-px h-full bg-gradient-to-b from-transparent via-primary/5 to-transparent opacity-30"></div>
<main class="w-full max-w-[440px] z-10">
<!-- Brand Identity Section -->
<div class="flex flex-col items-center mb-10">
<div class="mb-4 inline-flex items-center justify-center p-3 border-t-2 border-primary bg-surface-container shadow-[0_40px_40px_0_rgba(0,0,0,0.3)]">
<span class="font-display-lg text-headline-md text-primary tracking-tighter">AF</span>
</div>
<h1 class="font-display-lg text-headline-md text-on-surface text-center tracking-tight">ATTIA FROID</h1>
<p class="font-label-mono text-label-mono text-outline uppercase mt-2">Systèmes de Réfrigération Industrielle</p>
</div>
<!-- Login Card -->
<div class="glass-panel rounded-lg p-base md:p-gutter shadow-[0_40px_40px_0_rgba(0,0,0,0.3)] border border-white/10">
<div class="mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface">Portail Admin</h2>
<p class="font-body-md text-on-surface-variant mt-1">Accès sécurisé pour le personnel autorisé.</p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="floating-label-group">
<input class="w-full h-14 bg-[#161616] border border-outline-variant rounded-lg px-4 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="email" placeholder=" " required="" type="email"/>
<label class="font-body-md" for="email">Identifiant / Email</label>
<span class="absolute right-4 top-4 text-outline-variant material-symbols-outlined">alternate_email</span>
</div>
<!-- Password Field -->
<div class="floating-label-group">
<input class="w-full h-14 bg-[#161616] border border-outline-variant rounded-lg px-4 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="password" placeholder=" " required="" type="password"/>
<label class="font-body-md" for="password">Mot de passe</label>
<span class="absolute right-4 top-4 text-outline-variant material-symbols-outlined">lock</span>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between font-label-mono text-label-mono">
<label class="flex items-center space-x-2 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer hidden" type="checkbox"/>
<div class="w-4 h-4 border border-outline rounded-sm bg-transparent peer-checked:bg-primary peer-checked:border-primary transition-all"></div>
<span class="material-symbols-outlined text-black absolute text-[12px] opacity-0 peer-checked:opacity-100 left-0.5 top-0.5" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<span class="text-on-surface-variant group-hover:text-on-surface transition-colors">Rester connecté</span>
</label>
<a class="text-secondary hover:underline transition-all" href="#">Oublié ?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-14 bg-primary-container text-on-primary-container font-button-text text-button-text uppercase tracking-widest rounded-lg flex items-center justify-center gap-2 hover:bg-white hover:text-black active:scale-95 transition-all duration-200 cyan-glow" type="submit">
                    Connexion
                    <span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<div class="mt-8 pt-6 border-t border-white/5 text-center">
<p class="font-label-mono text-[12px] text-outline">
<span class="material-symbols-outlined align-middle text-[14px] mr-1">security</span>
                    SÉCURITÉ AES-256 ACTIVÉE
                </p>
</div>
</div>

                © 2024 ATTIA FROID • KÉLIBIA
            </p>
<div class="flex justify-center gap-6 mt-4 text-on-surface-variant font-label-mono text-[12px]">
<a class="hover:text-primary transition-colors" href="#">SUPPORT TECHNIQUE</a>
<span class="text-outline-variant">/</span>
<a class="hover:text-primary transition-colors" href="#">CONFIDENTIALITÉ</a>
</div>

<!-- Background Industrial Pattern Elements -->
<div class="fixed bottom-0 right-0 p-margin-desktop opacity-10 pointer-events-none select-none hidden md:block">
<div class="border-l border-b border-primary w-64 h-64 relative">
<div class="absolute -top-3 -right-3 text-primary font-label-mono text-[10px] transform rotate-90">REF_UN_4590</div>
<div class="absolute top-1/2 left-4 w-full h-px bg-primary/20"></div>
</div>
</div>
<script>
        // Micro-interaction for the login button glow
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('mousemove', (e) => {
            const rect = loginBtn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            loginBtn.style.setProperty('--x', `${x}px`);
            loginBtn.style.setProperty('--y', `${y}px`);
        });

        // Floating label initial state check
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('blur', () => {
                if (input.value !== "") {
                    input.classList.add('has-value');
                } else {
                    input.classList.remove('has-value');
                }
            });
        });
    </script>
